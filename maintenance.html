<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сервис временно недоступен — sapkeflykino</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#05070a url('/bg.png') no-repeat center center;
    background-size:cover;
    color:#fff;min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;inset:0;z-index:0;
    background:linear-gradient(90deg,rgba(0,0,0,.93) 0%,rgba(0,0,0,.78) 34%,rgba(0,0,0,.18) 70%,rgba(0,0,0,0) 100%);
  }
  .wrap{position:relative;z-index:1;padding:6vh 7vw;max-width:660px;}
  h1{font-size:clamp(34px,6.2vw,62px);font-weight:800;line-height:1.04;letter-spacing:-.02em;}
  h1 .g{color:#a3e635;display:block;}
  p{margin-top:22px;font-size:clamp(15px,2.4vw,19px);line-height:1.55;color:rgba(255,255,255,.72);max-width:32ch;}
  .btn{
    margin-top:34px;display:inline-flex;align-items:center;gap:10px;
    background:#84cc16;color:#0a0a0b;font-weight:700;font-size:16px;
    padding:15px 26px;border-radius:999px;text-decoration:none;border:none;cursor:pointer;
    box-shadow:0 10px 30px rgba(132,204,22,.35);transition:background .15s,transform .1s;
  }
  .btn:hover{background:#9ae21a;}
  .btn:active{transform:translateY(1px);}
  .btn svg{width:20px;height:20px;}
  @media (max-width:640px){
    body{align-items:flex-start;}
    body::before{background:linear-gradient(180deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.72) 46%,rgba(0,0,0,.45) 100%);}
    .wrap{padding:13vh 8vw;max-width:100%;}
    p{max-width:38ch;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Сервис временно <span class="g">недоступен</span></h1>
    <p>Мы проводим технические работы для улучшения сервиса. Скоро всё снова заработает!</p>
    <button class="btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Обновить страницу
    </button>
  </div>
</body>
</html>

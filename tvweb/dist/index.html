<body style="margin:0;background:#0a0a0b">
<div id="root"></div>
<script>
/*
  ТЁМНАЯ ТЕМА И БЕЗОПАСНАЯ ЗОНА ЭКРАНА.

  1. Цвета. Оформление сайта описано двумя наборами: светлым по умолчанию и
     тёмным по классу `dark` на странице. Сайт этот класс ставит, а обёртка —
     нет. Из-за этого карточки и подписи оставались светлыми поверх тёмного
     фона: на фото с телевизора названия читались как белое по белому.

  2. Края. Телевизор обрезает кадр по периметру (overscan) — у Егора верхняя
     полоса с логотипом и «Поиском» не видна вообще, сколько ни листай.
     Поэтому отступаем от краёв: 3% по вертикали, 1.5% по горизонтали. Плеер
     это не задевает — он лежит поверх, отдельным слоем.
*/
(function () {
  try {
    var h = document.documentElement;
    if (h.className.indexOf("dark") < 0) h.className += " dark";
    // Отступ ставим ПРЯМО НА ЭЛЕМЕНТ, а не правилом в таблице стилей:
    // оформление приложения правило перебивало, и отступ не появлялся.
    var корень = document.getElementById("root");
    if (корень) {
      корень.style.boxSizing = "border-box";
      корень.style.padding = "3vh 1.5vw";
    }

<script>
/*
  ПОДПОРКИ ДЛЯ СТАРЫХ ДВИЖКОВ. Выполняются ПЕРВЫМИ, до приложения.

  Разбор кода по правилам ES5 ловит только синтаксис. А есть возможности,
  которые появились позже и синтаксически выглядят обычно: на Tizen 5
  (Chromium 63) их просто нет, и код падает на ровном месте.

  Обе нужны в боевых путях: AbortController — в получении ссылки на видео,
  то есть прямо в запуске плеера; Object.fromEntries — в истории просмотра.
*/
(function () {
  if (!Object.fromEntries) {
    Object.fromEntries = function (list) {
      var out = {}, arr = list;
      if (list && typeof list.forEach === "function" && !(list instanceof Array)) {
        arr = []; list.forEach(function (p) { arr.push(p); });
      }
      for (var i = 0; i < arr.length; i++) { out[arr[i][0]] = arr[i][1]; }
      return out;
    };
  }
  if (typeof window.AbortController === "undefined") {
    // Прерывать запрос на таком движке всё равно нечем — важно, чтобы код,
    // который его создаёт, не падал. Сроки ожидания у нас заданы отдельно.
    var Signal = function () { this.aborted = false; this.onabort = null; };
    Signal.prototype.addEventListener = function (t, f) { if (t === "abort") this.onabort = f; };
    Signal.prototype.removeEventListener = function () { this.onabort = null; };
    var Ctrl = function () { this.signal = new Signal(); };
    Ctrl.prototype.abort = function () {
      this.signal.aborted = true;
      if (this.signal.onabort) { try { this.signal.onabort(); } catch (e) {} }
    };
    window.AbortController = Ctrl;
  }
})();

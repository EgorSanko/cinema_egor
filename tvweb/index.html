<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>SAPKEFLY KINO</title>
</head>
<body style="margin:0;background:#0a0a0b">
<div id="root"></div>
<!--
  Проверка «до всего». Запускается ПЕРВОЙ, на голом ES5, без React и без
  обещаний. Пишет свои шаги прямо на экран и шлёт их нам картинкой.

  Зачем: на телевизоре Егора экран замирал на «готовлю подборки», при этом
  ошибок не приходило и запросы не уходили — то есть код останавливался
  где-то раньше, а увидеть где было нечем. Если React запустится нормально,
  он просто перерисует экран поверх и этих строк никто не увидит.
-->
<div id="boot" style="display:none"></div>
<script>
/*
  ПОДПОРКИ ДЛЯ СТАРЫХ ДВИЖКОВ. Выполняются ПЕРВЫМИ, до приложения.

  Разбор кода по правилам ES5 ловит только синтаксис. А есть возможности,
  которые появились позже и синтаксически выглядят обычно: на Tizen 5
  (Chromium 63) их просто нет, и код падает на ровном месте.

  Обе нужны в боевых путях: AbortController — в получении ссылки на видео,
  то есть прямо в запуске плеера; Object.fromEntries — в истории просмотра.
*/
(function () {
  if (!Object.fromEntries) {
    Object.fromEntries = function (list) {
      var out = {}, arr = list;
      if (list && typeof list.forEach === "function" && !(list instanceof Array)) {
        arr = []; list.forEach(function (p) { arr.push(p); });
      }
      for (var i = 0; i < arr.length; i++) { out[arr[i][0]] = arr[i][1]; }
      return out;
    };
  }
  if (typeof window.AbortController === "undefined") {
    // Прерывать запрос на таком движке всё равно нечем — важно, чтобы код,
    // который его создаёт, не падал. Сроки ожидания у нас заданы отдельно.
    var Signal = function () { this.aborted = false; this.onabort = null; };
    Signal.prototype.addEventListener = function (t, f) { if (t === "abort") this.onabort = f; };
    Signal.prototype.removeEventListener = function () { this.onabort = null; };
    var Ctrl = function () { this.signal = new Signal(); };
    Ctrl.prototype.abort = function () {
      this.signal.aborted = true;
      if (this.signal.onabort) { try { this.signal.onabort(); } catch (e) {} }
    };
    window.AbortController = Ctrl;
  }
})();
</script>
<script>
(function () {
  var box = document.getElementById("boot");
  var lines = [];
  function step(t) {
    lines.push(t);
    if (box) box.innerHTML = lines.join(String.fromCharCode(10));
    try {
      var i = new Image();
      i.src = "/tv-error?m=" + encodeURIComponent("boot: " + t);
    } catch (e) {}
  }
  step("1. страница загружена");
  try {
    var r = new XMLHttpRequest();
    r.open("GET", "/tmdb-api/movie/popular?api_key=275c9d09780aadb4b13ff57a731eda00&language=ru-RU&_=" + new Date().getTime(), true);
    r.timeout = 10000;
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      step("3. ответ: код " + r.status + ", длина " + (r.responseText || "").length);
      try {
        var d = JSON.parse(r.responseText);
        step("4. разобрано, фильмов: " + ((d.results || []).length));
      } catch (e) { step("4. РАЗБОР НЕ УДАЛСЯ: " + e); }
    };
    r.ontimeout = function () { step("3. ТАЙМАУТ запроса"); };
    r.onerror = function () { step("3. ОШИБКА сети"); };
    r.send();
    step("2. запрос отправлен");
  } catch (e) {
    step("2. НЕ СМОГ отправить запрос: " + e);
  }
  step("5. проверка Promise: " + (typeof Promise));
  setTimeout(function () { step("6. таймеры работают"); }, 1500);

  // СТОРОЖ. Обёртка запускается сразу из MSX, без меню. Если она не поднимется,
  // без этого сторожа человек остаётся один на один с вечной загрузкой и выйти
  // может только переустановкой MSX — так уже было. Поэтому: не показали
  // подборки за 14 секунд — рисуем выход и уводим в меню по любой кнопке.
  setTimeout(function () {
    if (window.__SAPKEFLY_TV_READY__) return;
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div style="position:fixed;left:0;top:0;right:0;bottom:0;background:#0a0a0b;' +
        'color:#fff;font:24px Arial,sans-serif;display:flex;align-items:center;' +
        'justify-content:center;text-align:center;padding:40px">' +
        'Приложение не запустилось.<br><br>Нажмите любую кнопку — откроется меню.' +
        "</div>";
    }
    var go = function () { window.location.href = "https://msx.benzac.de/?start=menu:https://sapkeflykino.ru/msx/menu.json"; };
    document.addEventListener("keydown", go);
    setTimeout(go, 20000);
  }, 14000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

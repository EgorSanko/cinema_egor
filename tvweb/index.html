<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>SAPKEFLY KINO</title>
</head>
<body style="margin:0;background:#0a0a0b">
<div id="root"></div>
<script>
/*
  ПОДГОНКА ПОД РЕАЛЬНЫЙ ЭКРАН.

  Обёртка свёрстана под 1280 и до сих пор полагалась на мета-тег
  width=1280: телевизорные браузеры такую страницу сами ужимают под экран.
  Но APK-обёртка на Android открывает нас через WebView, а он по умолчанию
  мета-ширину игнорирует — и просто обрезает правый край. У друга Егора на
  Android TV из-за этого уезжала половина клавиатуры на экране входа, и
  так на КАЖДОМ экране, а не только на входе.

  Поэтому больше не надеемся на мета-тег, а меряем окно сами и задаём zoom:
  тогда приложению всегда достаётся ровно 1280 логических точек, а по экрану
  оно растягивается точно в край. Там, где браузер и так справляется
  (MSX, webOS), окно уже равно 1280, коэффициент выходит 1 — и не меняется
  ничего.

  Именно zoom, а не transform: transform ломает position:fixed, на чём мы
  уже обжигались с шапкой.
*/
(function () {
  var ШИРИНА = 1280;
  function подогнать() {
    var ш = window.innerWidth || document.documentElement.clientWidth || ШИРИНА;
    var к = ш / ШИРИНА;
    if (!isFinite(к) || к <= 0) к = 1;

    // ТОЛЬКО УМЕНЬШАЕМ, никогда не увеличиваем.
    //
    // Увеличение через zoom ломает вёрстку: единицы vh и vw считаются от
    // НЕСКАЛИРОВАННОГО экрана, поэтому при zoom 1.5 блок высотой 100vh
    // рисуется в полтора экрана и низ уезжает — проверено на 1920.
    // А экран шире 1280 нам ужимать и не надо: там и так всё влезает.
    if (к > 1) к = 1;

    var корень = document.documentElement;
    // Меньше 2% расхождения — не трогаем: лишний zoom только мылит картинку.
    if (к > 0.98 && к < 1.02) { корень.style.zoom = ""; return; }
    корень.style.zoom = к;
    try {
      var i = new Image();
      i.src = "/tv-error?m=" + encodeURIComponent("подгонка экрана: окно " + ш + ", коэффициент " + к.toFixed(3));
    } catch (e) {}
  }
  подогнать();
  if (window.addEventListener) window.addEventListener("resize", подогнать);
})();
</script>
<script>
/*
  РАЗВИЛКА ПО ТЕЛЕВИЗОРУ.

  Samsung (Tizen) не выдерживает полную обёртку: по сигналам он доходит до
  «главная нарисована» и гаснет, не загрузив ни одной картинки. У Samsung это
  известная болезнь — в их сообществе её называют «renderer process has
  crashed»: экран гаснет и страница перезагружается сама. Движок там Chromium 63
  (Samsung Browser 8.0), и разборы оптимизации под Tizen прямо называют причиной
  слишком много кода в главном потоке. У нашей обёртки скрипт 702 КБ.

  Поэтому такие телевизоры отправляем на лёгкий клиент: он написан вручную, без
  React, весит 56 КБ и на этом же телевизоре открылся с первого раза. Плеер там
  НАШ — свой <video>, выбор озвучки и качества, продолжение просмотра, пропуск
  заставки; ключи позиции совпадают с сайтом, поэтому история общая.

  Проверить полную обёртку на таком телевизоре всё ещё можно: добавить к адресу
  ?full=1.
*/
(function () {
  try {
    var u = navigator.userAgent || "";
    var самсунг = /Tizen|SMART-TV/i.test(u);
    var принудительно = /[?&]full=1/.test(location.search);
    if (самсунг && !принудительно) {
      try {
        var i = new Image();
        i.src = "/tv-error?m=" + encodeURIComponent("развилка: Samsung -> лёгкий клиент");
      } catch (e) {}
      location.replace("/tvapp/?t=" + new Date().getTime());
    }
  } catch (e) {}
})();
</script>
<script>
/*
  ТЁМНАЯ ТЕМА И БЕЗОПАСНАЯ ЗОНА ЭКРАНА.

  1. Цвета. Оформление сайта описано двумя наборами: светлым по умолчанию и
     тёмным по классу `dark` на странице. Сайт этот класс ставит, а обёртка —
     нет. Из-за этого карточки и подписи оставались светлыми поверх тёмного
     фона: на фото с телевизора названия читались как белое по белому.

  2. Края. Телевизор обрезает кадр по периметру (overscan) — у Егора верхняя
     полоса с логотипом и «Поиском» не видна вообще, сколько ни листай.
     Поэтому отступаем от краёв: 3% по вертикали, 1.5% по горизонтали. Плеер
     это не задевает — он лежит поверх, отдельным слоем.
*/
(function () {
  try {
    var h = document.documentElement;
    if (h.className.indexOf("dark") < 0) h.className += " dark";
    // Отступ ставим ПРЯМО НА ЭЛЕМЕНТ, а не правилом в таблице стилей:
    // оформление приложения правило перебивало, и отступ не появлялся.
    var корень = document.getElementById("root");
    if (корень) {
      корень.style.boxSizing = "border-box";
      // 5% по вертикали и 2.5% по горизонтали. Трёх процентов не хватало:
      // Егор по-прежнему не видел ни логотипа, ни «Поиска» — телевизоры
      // обрезают край заметно сильнее.
      корень.style.padding = "5vh 2.5vw";
    }
  } catch (e) {}
})();
</script>
<script>
/*
  Проверка отступов во флекс-раскладке.

  `gap` внутри flex появился в Chrome 84. Телевизоры Егора старше: на них он
  молча не действует, и все ТВ-экраны слипаются — полки главной наезжают друг
  на друга, карточки стоят вплотную, панель плеера сбивается в кучу. В обычном
  браузере этого не видно, поэтому вёрстка казалась исправной.

  Проверяем не строкой в стилях (для сеток `gap` поддерживается и там, где для
  флекса ещё нет), а измерением: два блока по десять точек с отступом десять
  должны дать тридцать.
*/
(function () {
  try {
    var w = document.createElement("div");
    w.style.cssText = "display:flex;gap:10px;position:absolute;visibility:hidden;top:-9999px";
    var a = document.createElement("span"), b = document.createElement("span");
    a.style.cssText = b.style.cssText = "display:block;width:10px;height:1px";
    w.appendChild(a); w.appendChild(b);
    (document.body || document.documentElement).appendChild(w);
    var есть = w.getBoundingClientRect().width >= 29;
    w.parentNode.removeChild(w);
    if (!есть) {
      document.documentElement.className += " no-flex-gap";
    }
  } catch (e) {
    // Не смогли проверить — считаем, что отступов нет: поля лишними не будут.
    document.documentElement.className += " no-flex-gap";
  }
})();
</script>
<style>
/* Поля вместо отступов — включаются только по признаку выше. */
.no-flex-gap .flex.gap-1:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-1:not(.flex-col) > * + * { margin-left: 0.25rem; }
.no-flex-gap .flex.flex-col.gap-1 > * + * { margin-top: 0.25rem; }
.no-flex-gap .flex.gap-1\.5:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-1\.5:not(.flex-col) > * + * { margin-left: 0.375rem; }
.no-flex-gap .flex.flex-col.gap-1\.5 > * + * { margin-top: 0.375rem; }
.no-flex-gap .flex.gap-2:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-2:not(.flex-col) > * + * { margin-left: 0.5rem; }
.no-flex-gap .flex.flex-col.gap-2 > * + * { margin-top: 0.5rem; }
.no-flex-gap .flex.gap-2\.5:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-2\.5:not(.flex-col) > * + * { margin-left: 0.625rem; }
.no-flex-gap .flex.flex-col.gap-2\.5 > * + * { margin-top: 0.625rem; }
.no-flex-gap .flex.gap-3:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-3:not(.flex-col) > * + * { margin-left: 0.75rem; }
.no-flex-gap .flex.flex-col.gap-3 > * + * { margin-top: 0.75rem; }
.no-flex-gap .flex.gap-4:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-4:not(.flex-col) > * + * { margin-left: 1rem; }
.no-flex-gap .flex.flex-col.gap-4 > * + * { margin-top: 1rem; }
.no-flex-gap .flex.gap-5:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-5:not(.flex-col) > * + * { margin-left: 1.25rem; }
.no-flex-gap .flex.flex-col.gap-5 > * + * { margin-top: 1.25rem; }
.no-flex-gap .flex.gap-6:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-6:not(.flex-col) > * + * { margin-left: 1.5rem; }
.no-flex-gap .flex.flex-col.gap-6 > * + * { margin-top: 1.5rem; }
.no-flex-gap .flex.gap-7:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-7:not(.flex-col) > * + * { margin-left: 1.75rem; }
.no-flex-gap .flex.flex-col.gap-7 > * + * { margin-top: 1.75rem; }
.no-flex-gap .flex.gap-8:not(.flex-col) > * + *,
.no-flex-gap .inline-flex.gap-8:not(.flex-col) > * + * { margin-left: 2rem; }
.no-flex-gap .flex.flex-col.gap-8 > * + * { margin-top: 2rem; }
</style>
<!--
  Проверка «до всего». Запускается ПЕРВОЙ, на голом ES5, без React и без
  обещаний. Пишет свои шаги прямо на экран и шлёт их нам картинкой.

  Зачем: на телевизоре Егора экран замирал на «готовлю подборки», при этом
  ошибок не приходило и запросы не уходили — то есть код останавливался
  где-то раньше, а увидеть где было нечем. Если React запустится нормально,
  он просто перерисует экран поверх и этих строк никто не увидит.
-->
<div id="boot" style="display:none"></div>
<script>
/*
  ПОДПОРКИ ДЛЯ СТАРЫХ ДВИЖКОВ. Выполняются ПЕРВЫМИ, до приложения.

  Разбор кода по правилам ES5 ловит только синтаксис. А есть возможности,
  которые появились позже и синтаксически выглядят обычно: на Tizen 5
  (Chromium 63) их просто нет, и код падает на ровном месте.

  Обе нужны в боевых путях: AbortController — в получении ссылки на видео,
  то есть прямо в запуске плеера; Object.fromEntries — в истории просмотра.
*/
(function () {
  if (!Object.fromEntries) {
    Object.fromEntries = function (list) {
      var out = {}, arr = list;
      if (list && typeof list.forEach === "function" && !(list instanceof Array)) {
        arr = []; list.forEach(function (p) { arr.push(p); });
      }
      for (var i = 0; i < arr.length; i++) { out[arr[i][0]] = arr[i][1]; }
      return out;
    };
  }
  if (typeof window.AbortController === "undefined") {
    // Прерывать запрос на таком движке всё равно нечем — важно, чтобы код,
    // который его создаёт, не падал. Сроки ожидания у нас заданы отдельно.
    var Signal = function () { this.aborted = false; this.onabort = null; };
    Signal.prototype.addEventListener = function (t, f) { if (t === "abort") this.onabort = f; };
    Signal.prototype.removeEventListener = function () { this.onabort = null; };
    var Ctrl = function () { this.signal = new Signal(); };
    Ctrl.prototype.abort = function () {
      this.signal.aborted = true;
      if (this.signal.onabort) { try { this.signal.onabort(); } catch (e) {} }
    };
    window.AbortController = Ctrl;
  }
})();
</script>
<script>
(function () {
  var box = document.getElementById("boot");
  var lines = [];
  function step(t) {
    lines.push(t);
    if (box) box.innerHTML = lines.join(String.fromCharCode(10));
    try {
      var i = new Image();
      i.src = "/tv-error?m=" + encodeURIComponent("boot: " + t);
    } catch (e) {}
  }
  step("1. страница загружена");
  try {
    var r = new XMLHttpRequest();
    r.open("GET", "/tmdb-api/movie/popular?language=ru-RU&_=" + new Date().getTime(), true);
    r.timeout = 10000;
    r.onreadystatechange = function () {
      if (r.readyState !== 4) return;
      step("3. ответ: код " + r.status + ", длина " + (r.responseText || "").length);
      try {
        var d = JSON.parse(r.responseText);
        step("4. разобрано, фильмов: " + ((d.results || []).length));
      } catch (e) { step("4. РАЗБОР НЕ УДАЛСЯ: " + e); }
    };
    r.ontimeout = function () { step("3. ТАЙМАУТ запроса"); };
    r.onerror = function () { step("3. ОШИБКА сети"); };
    r.send();
    step("2. запрос отправлен");
  } catch (e) {
    step("2. НЕ СМОГ отправить запрос: " + e);
  }
  step("5. проверка Promise: " + (typeof Promise));
  // ЧЕТЫРЕ РАЗНЫХ МЕХАНИЗМА ВРЕМЕНИ.
  //
  // На Samsung (Tizen 5) внутри MSX шаги 1-5 приходят, а шаг из обычного
  // setTimeout — никогда. На LG приходит, и там всё работает. React обновляет
  // экран через свою очередь, а очередь стоит на таймерах: отсюда вечная
  // загрузка при живой сети. Проверяем, что именно мертво, — от этого зависит
  // способ обхода.
  setTimeout(function () { step("6. таймер 1500"); }, 1500);
  setTimeout(function () { step("6a. таймер 300"); }, 300);
  var iv = setInterval(function () { clearInterval(iv); step("6b. интервал"); }, 500);
  try {
    var rafN = 0;
    var tick = function () {
      rafN++;
      if (rafN === 30) step("6c. кадры (rAF) идут");
      if (rafN < 30) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  } catch (e) { step("6c. rAF НЕТ: " + e); }
  try {
    var mc = new MessageChannel();
    mc.port1.onmessage = function () { step("6d. MessageChannel живой"); };
    mc.port2.postMessage(1);
  } catch (e) { step("6d. MessageChannel НЕТ: " + e); }
  try {
    Promise.resolve().then(function () { step("6e. микрозадачи идут"); });
  } catch (e) { step("6e. промисы НЕТ: " + e); }

  // СТОРОЖ. Обёртка запускается сразу из MSX, без меню. Если она не поднимется,
  // без этого сторожа человек остаётся один на один с вечной загрузкой и выйти
  // может только переустановкой MSX — так уже было. Поэтому: не показали
  // подборки за 14 секунд — рисуем выход и уводим в меню по любой кнопке.
  setTimeout(function () {
    if (window.__SAPKEFLY_TV_READY__) return;
    var root = document.getElementById("root");
    if (root) {
      root.innerHTML =
        '<div style="position:fixed;left:0;top:0;right:0;bottom:0;background:#0a0a0b;' +
        'color:#fff;font:24px Arial,sans-serif;display:flex;align-items:center;' +
        'justify-content:center;text-align:center;padding:40px">' +
        'Приложение не запустилось.<br><br>Нажмите любую кнопку — откроется меню.' +
        "</div>";
    }
    var go = function () { window.location.href = "https://msx.benzac.de/?start=menu:https://sapkeflykino.ru/msx/menu.json"; };
    document.addEventListener("keydown", go);
    setTimeout(go, 20000);
  }, 14000);
})();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>

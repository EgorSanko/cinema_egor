<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280,initial-scale=1">
<title>SAPKEFLY KINO</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--
  ТВ-клиент sapkeflykino.

  Почему он отдельный, а не наш сайт в обёртке. Сайт собран Next.js 16 и
  Tailwind 4: в бандле остаются `?.` и `??` (Next держит фиксированную
  современную планку и browserslist игнорирует — проверено чистой сборкой), а
  в CSS 903 раза встречается color-mix, плюс @layer и oklch. Это Chrome 111,
  весна 2023 года. Движок телевизора 2016-2020 годов на таком JS падает на
  первой строке, а содержимое @layer выбрасывает целиком — остаётся голый
  HTML. Это не догадка: три ТВ-устройства прислали нам на /tv-error
  «Uncaught SyntaxError: Unexpected token .» и показали чёрный экран.

  Здесь только ES5, XMLHttpRequest вместо fetch, CSS без переменных и
  современных функций цвета. Данные и хранилище — те же, что у сайта, поэтому
  просмотр продолжается между телевизором и телефоном.

  Один каталог упаковывается во все форматы:
    Android TV — APK-обёртка (ставится с флешки)
    Samsung    — .wgt  (config.xml)
    LG         — .ipk  (appinfo.json)
    Любой ТВ   — просто открыть адрес в браузере телевизора
-->
<div id="app">

  <div id="screen-login" class="screen">
    <div class="brand">SAPKEFLY <span>KINO</span></div>
    <div id="login-box" class="login-box"></div>
  </div>

  <div id="screen-home" class="screen hidden">
    <div class="topbar">
      <div class="brand">SAPKEFLY <span>KINO</span></div>
      <div class="who">Вы: <b id="who">Гость</b> &nbsp;·&nbsp; стрелки — выбор, OK — открыть, «назад» — выход</div>
    </div>
    <div class="viewport"><div id="rows"></div></div>
  </div>

  <div id="screen-search" class="screen hidden">
    <div class="brand">Поиск</div>
    <div id="query" class="query">&nbsp;</div>
    <div id="keyboard" class="keyboard"></div>
    <div class="viewport-h"><div id="results" class="grid"></div></div>
  </div>

  <div id="screen-detail" class="screen hidden">
    <div id="detail" class="detail"></div>
  </div>

  <div id="screen-player" class="screen hidden">
    <video id="video" class="video"></video>
    <!-- Пропуск заставки: Alloha отдаёт skipTime, показываем кнопку в это окно -->
    <div id="skip" class="skip hidden">Пропустить заставку — OK</div>
    <!-- Оверлей управления: сам прячется через 5 секунд, как в веб-обёртке -->
    <div id="controls" class="controls hidden">
      <div id="ctitle" class="ctitle"></div>
      <div id="timeline" class="timeline"><div id="tlfill" class="tlfill"></div></div>
      <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
      <div id="cbuttons" class="cbuttons"></div>
    </div>
    <div id="settings" class="settings hidden"></div>
    <div id="player-msg" class="player-msg"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <!-- Всегда видимая строка состояния: на телевизоре нет консоли, и без неё
       «пустой экран» неотличим от «приложение не запустилось». -->
  <div id="diag" class="diag">запуск…</div>
</div>
<!--
  Проигрывание HLS кусками.

  Без него клиент просто отдавал ссылку телевизору и надеялся на встроенный
  разбор. LG так умеет, Samsung — нет: по логам он забирал плейлист и НИ РАЗУ
  не запрашивал сами куски видео, поэтому «плеер не работает».

  Файл облегчённый (light-сборка, без лишних форматов) и грузится ДО приложения.
-->
<!--
  Рисовалка QR для экрана входа. Егор: «вход по QR было мега удобно, а не по
  коду». Библиотека чистая, без сборщика, понятна старым движкам.
-->
<script src="qrcode.js"></script>
<script src="hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
